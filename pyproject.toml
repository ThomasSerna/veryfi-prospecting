[project]
name = "veryfi-prospecting"
version = "0.1.0"
description = "Prototipo académico local de prospección para Veryfi."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic==1.11.0",
    "pydantic==2.13.5",
    "streamlit==1.65.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
