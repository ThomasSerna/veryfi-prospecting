{% load prospecting_ui %}
<div class="field filter-choice"><p class="filter-label" id="label_{{ field.auto_id }}">{{ field.label }}</p><details {% if field.errors %}open{% endif %}><summary aria-labelledby="label_{{ field.auto_id }} value_{{ field.auto_id }}"><span id="value_{{ field.auto_id }}">{% if field.value %}{% if field.value|length == 1 %}{{ field.value.0|label }}{% else %}{{ field.value|length }} seleccionados{% endif %}{% else %}Todos{% endif %}</span></summary><div class="filter-options" role="group" aria-labelledby="label_{{ field.auto_id }}">{{ field }}{% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}</div></details></div>
